<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="700" height="700" viewBox="0 0 700 700">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F5AA6"/>
      <stop offset="100%" stop-color="#1EC6C9"/>
    </linearGradient>
  </defs>

  <!-- Shopping Cart -->
  <g stroke="#163B7A" stroke-width="14" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M120 250 H170 L205 430 H470"/>
    <path d="M205 430 H470"/>
    <path d="M170 250 L205 430"/>
    <path d="M200 300 H500"/>
  </g>

  <!-- Wheels -->
  <circle cx="250" cy="500" r="22" fill="#163B7A"/>
  <circle cx="430" cy="500" r="22" fill="#163B7A"/>

  <!-- Medicine Bottle -->
  <g>
    <rect x="220" y="140" width="120" height="170" rx="18" fill="url(#grad)"/>
    <rect x="250" y="105" width="60" height="40" rx="8" fill="#1F5AA6"/>
    <rect x="272" y="175" width="16" height="70" fill="#fff"/>
    <rect x="245" y="202" width="70" height="16" fill="#fff"/>
  </g>

  <!-- Capsule Strip -->
  <g transform="translate(360,150) rotate(18)">
    <rect width="80" height="150" rx="16" fill="#1EC6C9"/>
    <g fill="#fff">
      <circle cx="22" cy="25" r="8"/>
      <circle cx="58" cy="25" r="8"/>
      <circle cx="22" cy="62" r="8"/>
      <circle cx="58" cy="62" r="8"/>
      <circle cx="22" cy="99" r="8"/>
      <circle cx="58" cy="99" r="8"/>
      <circle cx="22" cy="136" r="8"/>
      <circle cx="58" cy="136" r="8"/>
    </g>
  </g>

  <!-- Capsule -->
  <g transform="translate(145,175) rotate(-25)">
    <rect x="0" y="0" width="32" height="80" rx="16" fill="#1F5AA6"/>
    <rect x="0" y="40" width="32" height="40" rx="0" fill="#1EC6C9"/>
    <line x1="0" y1="40" x2="32" y2="40" stroke="#fff" stroke-width="3"/>
  </g>
</svg>
